<!DOCTYPE html>
<html lang="zh-TW">
    <head>
        <meta charset="UTF-8">

        <tilte>台中跑咖地圖</tilte>

        <link

        rel="stylesheet"

        href="https://unpkg.com/leaflet/dist/leaflet.css"

        />
        
        <style>
            body{
                font-family: Arial,sans-serif;
                text-align: center;
                background-color:#A98B73;
                padding: 50px;
            }
            h1{
                color:#333;
                padding-top: 20px;
            }

            button{
                   min-width: 120px;
                   height: 40px;
                   padding:10px;
                   border:none;
                   border-radius:10px;
                   background: white;
                   cursor:pointer;
                   font-size: 16px;
                   margin-top: 10px;
                   transition: 0.3s;
            }

            .active{
                   background:green;
                   color: white;
            }

            #map{
                 width:80%;
                 height:600px;
                 margin:30px auto;
                 border-radius:20px;
                 overflow:hidden;
                 box-shadow:0 0 10px rgba(0,0,0,0.2);
            }
            </style>
            </head>

            <body>
                <h1>你好，我喝一點☕</h1>

                <div class ="filters">

                <button id = "openBtn" onclick="toggleFilter('open')">
                現在營業中 
                </button>

                <button id = "wifiBtn" onclick="toggleFilter('wifi')">
                網路 
                </button>

                <button id = "socketBtn" onclick="toggleFilter('socket')">
                插座 
                </button>

                <button id = "limitedTimeBtn" onclick="toggleFilter('limitedTime')">
                不限時 
                </button>

                </div>

                <div id ="map"></div>

                <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

                <script>

                const map = L.map('map').setView([24.1477, 120.6736], 13);

                 L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {

                 attribution: '© OpenStreetMap'

                }).addTo(map);


                const cafes = [
                    {
                        name:"Coffee Stopover Black",
                        wifi:true,
                        socket:true,
                        limitedTime:false, 
                        lat: 24.1457119,
                        lng: 120.67195502,
                        info: "世界百大咖啡館",
                        hours: {
                            mon:"休息中",
                            tue:"14:00-19:00",
                            wed:"14:00-19:00",
                            thu:"14:00-19:00",
                            fri:"14:00-19:00",
                            sat:"14:00-19:00",
                            sun:"休息中"
                        },
                        url: "https://www.coffeestopover.com/",
                        
                    },

                    {
                        name:"Spirited Bakery",
                        wifi:false,
                        socket:false,
                        limitedTime:true, 
                        lat: 24.13934,
                        lng: 120.66253,
                        info: "美式軟餅乾",
                        hours: {
                            mon:"12:00-20:00",
                            tue:"休息中",
                            wed:"休息中",
                            thu:"12:00-20:00",
                            fri:"12:00-20:00",
                            sat:"12:00-20:00",
                            sun:"12:00-20:00"
                        },
                        url: "https://www.instagram.com/spiritedbakery/",
                        
                    },

                    {
                        name:"Phase Coffee Roasters",
                        wifi:true,
                        socket:false,
                        limitedTime:true, 
                        lat: 24.13986,
                        lng: 120.68079,
                        info: "推薦法式吐司",
                        hours: {
                            mon:"9:00-19:00",
                            tue:"9:00-19:00",
                            wed:"9:00-19:00",
                            thu:"9:00-19:00",
                            fri:"9:00-19:00",
                            sat:"9:00-19:00",
                            sun:"9:00-19:00"
                        },
                        url: "https://phasecoffeeroasters.com/",
                        
                    },

                    {
                     name:"噓。咖啡",
                        wifi:true,
                        socket:false,
                        limitedTime:false, 
                        lat: 24.15221,
                        lng: 120.66286,
                        info: "水母咖啡廳",
                        hours: {
                            mon:"12:00-1:00",
                            tue:"12:00-1:00",
                            wed:"12:00-1:00",
                            thu:"12:00-1:00",
                            fri:"12:00-2:00",
                            sat:"12:00-2:00",
                            sun:"12:00-1:00"
                        },
                        url: "https://www.instagram.com/shhhhh.cafe_n_bar",
                    },

                    {
                     name:"ORIG BLACK",
                        wifi:true,
                        socket:true,
                        limitedTime:false, 
                        lat: 24.17315,
                        lng: 120.70227,
                        info: "黑色系咖啡廳",
                        hours: {
                            mon:"11:00-18:30",
                            tue:"11:00-18:30",
                            wed:"11:00-18:30",
                            thu:"11:00-18:30",
                            fri:"9:00-20:00",
                            sat:"9:00-20:00",
                            sun:"9:00-20:00"
                        },
                        url: "https://origblack.com/",
                    },

                    {
                     name:"Tamp Temper Taichung Coffee",
                        wifi:false,
                        socket:false,
                        limitedTime:false, 
                        lat: 24.14670,
                        lng: 120.67017,
                        info: "多種咖啡豆自選",
                        hours: {
                            mon:"9:00-17:30",
                            tue:"9:00-17:30",
                            wed:"9:00-17:30",
                            thu:"9:00-17:30",
                            fri:"9:00-17:30",
                            sat:"9:30-16:00",
                            sun:"休息中"
                        },
                        url: "https://www.instagram.com/tamptempercoffee/",
                    },

                
                ];

                const filters = {
                    open: false,
                    wifi: false,
                    socket: false,
                    limitedTime: false
                };

                let markers = [];

                function renderCafes(cafeList){
                    markers.forEach(marker =>{
                        map.removeLayer(marker);
                    });

                    markers = [];

                    cafeList.forEach(cafe => {

                        const marker = 
                        L.marker([cafe.lat, cafe.lng])
                        .addTo(map)
                        .bindPopup(`

                        <h3>${cafe.name}</h3>
                        <p>${cafe.info}</p> 
                        <p>營業時間 <br> 
                            星期一: ${cafe.hours.mon} <br>
                            星期二: ${cafe.hours.tue} <br>
                            星期三: ${cafe.hours.wed} <br>
                            星期四: ${cafe.hours.thu} <br>
                            星期五: ${cafe.hours.fri} <br>
                            星期六: ${cafe.hours.sat} <br>
                            星期日: ${cafe.hours.sun} <br>
                            </p>
                        <a href="${cafe.url}" target="_blank">
                            店家連結
                        </a>

                        `);

                        markers.push(marker);
                    });
                }

                renderCafes(cafes);

                function toggleFilter(type){
                    filters[type] = !filters[type];

                    const button = 
                    document.getElementById(type + "Btn");

                    button.classList.toggle("active");

                    applyFilters();
                };

                function applyFilters(){

                    const now = new Date();

                    const days = [
                        "sun",
                        "mon",
                        "tue",
                        "wed",
                        "thu",
                        "fri",
                        "sat"
                    ];

                    const today = days [now.getDay()];
                    const currentTime =now.getHours() * 60 + now.getMinutes();

                    const result = cafes.filter(cafe => {

                    if(filters.open){
                    const todayHours = cafe.hours[today];

                    if (!todayHours.includes("-")){
                        return false;
                    }

                    const parts = todayHours.split("-");
                    const openTime = parts[0];
                    const closeTime = parts[1];

                    const openParts = openTime.split(":");
                    const closeParts = closeTime.split(":");

                    const openMinutes = parseInt(openParts[0]) * 60 + 
                                        parseInt(openParts[1]);

                    const closeMinutes = parseInt(closeParts[0]) * 60 + 
                                        parseInt(closeParts[1]); 
                                    
                    let isOpen;
                      
                    if(openMinutes < closeMinutes){ 
                        isOpen = 
                              currentTime >= openMinutes &&
                              currentTime <= closeMinutes;                    

                    }
                    else{
                        isOpen = 
                              currentTime >= openMinutes ||
                              currentTime <= closeMinutes;                    

                    }
                    
                    if(!isOpen){

                        return false;
                    }
                    
                    }

                    if(filters.wifi && !cafe.wifi){

                        return false;
                    }

                    if(filters.socket && !cafe.socket){

                        return false;
                    }

                    if(filters.limitedTime && cafe.limitedTime){

                        return false;
                    }

                    return true;

                });

                    renderCafes(result);
                } 
            
           
                </script>

                


            </body>
            </html>
